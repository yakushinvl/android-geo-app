name: Build Android APK
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем исходный код репозитория
      - name: Checkout Code
        uses: actions/checkout@v4

        # 2. Настраиваем Java (Kotlin-компилятор жестко привязан к версии JDK)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      # 3. Даем права на запуск Gradle в среде Linux
      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      # 4. Собираем тестовый APK (Debug)
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. Сохраняем готовый файл в артефакты GitHub Actions
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
