name: Build and Release Kotlin APK

on:
  push:
    tags:
      - 'v*' # Срабатывает только при пуше тегов (например, v1.0.0)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Скачиваем исходный код репозитория
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ВАЖНО: скачивает всю историю коммитов, чтобы правильно посчитать versionCode

      # 2. Настраиваем Java (Kotlin-компилятор жестко привязан к версии JDK)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      # 3. Даем права на запуск Gradle в среде Linux
      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      # [НОВЫЙ ШАГ] Извлекаем чистую версию из тега и считаем коммиты
      - name: Parse Version From Tag
        id: parse_version
        run: |
          TAG_NAME=${{ github.ref_name }}
          VERSION=${TAG_NAME#v} # Убирает букву 'v' из начала (из 'v1.2.3' делает '1.2.3')
          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV
          
          # Считаем общее количество коммитов для автоматического versionCode
          COMMITS_COUNT=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$COMMITS_COUNT" >> $GITHUB_ENV

      # 4. Собираем APK (Передаем версию из тега прямо в Gradle)
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            -PVERSION_CODE=${{ env.VERSION_CODE }} \
            -PVERSION_NAME="${{ env.VERSION_NAME }}"

      # 5. Сохраняем готовый файл в Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
